<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Home</title>
  <link rel="stylesheet" href="../CSS/Hi_User_Tablet.css" />
  <script src="../JS/Hi_User_Tablet.js" defer></script>
</head>
<body>

<main class="client-home">
  <!-- Cabecera bienvenida -->
  <section class="user-header">
    <div class="user-info">
      <img src="../Pictures/user-icon.png" alt="User icon" />
      <p>Hi, <strong>Your name HERE</strong></p>
    </div>
    <button class="settings-button">⚙️</button>
  </section>

  <!-- Contenido principal -->
  <section class="main-content">
    <div class="cards">
      <div class="info-card">
        <h3>Last time visited</h3>
        <div class="img-placeholder"></div>
        <button class="btn small">View History</button>
      </div>

      <div class="info-card">
        <h3>Most popular today</h3>
        <div class="img-placeholder"></div>
        <button class="btn small">Explore</button>
      </div>
    </div>

    <div class="location-box">
      <p><strong>📍 Your current location:</strong></p>
      <div class="map-placeholder"></div>
    </div>
  </section>

  <!-- Información útil -->
  <section class="quick-info">
    <div class="quick-card">
      <h4>📄 Personal Information</h4>
      <p>Manage your personal data, preferences and notifications.</p>
    </div>
    <div class="quick-card">
      <h4>🛠️ Report an Error</h4>
      <p>Tell us if something went wrong. We'll fix it quickly.</p>
    </div>
  </section>
</main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirm Reservation</title>
  <link rel="stylesheet" href="../CSS/Confirmation_Phone.css" />
  <script src="../JS/Confirmation_Phone.js" defer></script>
</head>
<body>

<main class="confirmation-page">
  <h1>Confirmation</h1>

  <section class="date-picker-section">
    <label for="reservation-date">
      <span class="calendar-icon">📅</span>
      <input type="date" id="reservation-date" name="reservation-date" required />
    </label>
    <p class="selected-day-label">Select a day</p>
  </section>

  <section class="select-service-section">
    <h2>Select Service</h2>
    <div class="service-options">
      <!-- Servicios generados dinámicamente -->
    </div>
  </section>

  <div class="confirm-container">
    <button id="confirm-button" disabled>Confirm Reservation</button>
  </div>
</main>

</body>
</html>

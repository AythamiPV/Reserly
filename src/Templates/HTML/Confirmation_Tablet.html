<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirm Reservation</title>
  <link rel="stylesheet" href="../CSS/Confirmation_Tablet.css" />
  <script src="../JS/Confirmation_Tablet.js" defer></script>
</head>
<body>

<<main class="confirmation-tablet">
  <section class="title-section">
    <h1>Confirmation</h1>
    <p>Select a date and service to confirm your reservation.</p>
  </section>

  <section class="form-layout">
    <div class="calendar-block">
      <label for="reservation-date">📅 Choose a date:</label>
      <input type="date" id="reservation-date" />
    </div>

    <div class="service-block">
      <h2>Select a Service:</h2>
      <div id="service-gallery" class="service-gallery">
        <!-- Servicios desde JSON -->
      </div>
    </div>
  </section>

  <div class="confirm-center">
    <button id="confirm-btn" disabled>Confirm Reservation</button>
  </div>
</main>

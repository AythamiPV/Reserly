<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserly - Manage Company</title>
    <link rel="stylesheet" href="../CSS/ManageCompanyStyles.css">
    <link rel="stylesheet" href="../CSS/TitleAndTextStyles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
<header id="header"></header>

<main class="main-container">
    <div class="company-profile">
        <img src="../Pictures/UserDefault-icon.png" alt="Company Profile" class="company-logo">
        <span class="company-name">Company Name</span>
        <img src="../Pictures/PencilEdit-icon.png" alt="Edit Icon" class="edit-icon">
    </div>

    <div class="content-layout">
        <!-- Primera columna -->
        <div class="column">
            <div class="template-container">
                <h2>Schedule</h2>
                <div id="Schedule"></div>
                <h2>Timetable:</h2>
                <div id="ScheduleList"></div>
            </div>
            <div class="template-container">
                <h2>Select the holidays:</h2>
                <div id="Calendar"></div>
                <div class="button-container">
                    <button class="add-festive">Add festive</button>
                    <button class="remove-festive">Remove festive</button>
                </div>
            </div>
        </div>

        <!-- Segunda columna -->
        <div class="column">
            <div class="template-container">
                <h2>Services</h2>
                <div id="Service"></div>
                <h2>List of services:</h2>
                <div id="ServiceList"></div>
            </div>
            <div class="template-container">
                <h2>About you</h2>
                <img src="../Pictures/PencilEdit-icon.png" alt="Edit" class="edit-icon" id="edit-icon">
                <div class="editable-area">
                    <div id="editable-text" contenteditable="false" class="text-area">Click the pencil to edit this text.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sección de Location debajo de ambas columnas -->
    <div class="template-container">
        <h2>Location</h2>
        <div id="Location"></div>
    </div>

    <a href="CompanyMain.html">
        <button id="save-changes">Save changes</button>
    </a>
</main>

<footer id="main_footer"></footer>

<script src="../JS/LoadTemplates.js"></script>
<script src="../JS/AboutYouEditScript.js"></script>
<script src="../JS/CalendarScript.js"></script>
<script src="../JS/LoggedHeaderScript.js"></script>
<script src="../JS/ManageCompanyLoadData.js"></script>
<script src="../JS/MapScript.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</body>
</html>

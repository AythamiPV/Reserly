<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Responsive</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
    <link rel="stylesheet" href="../CSS/Hi_user.css">
    <script defer src="../JS/Hi_user.js"></script>
</head>
<body class="bg-[#0A192F] text-white font-[Poppins]">
<header class="header-container bg-[#112240] shadow-lg p-4 rounded-b-2xl flex items-center justify-between">
    <!-- Contenedor del perfil -->
    <div class="profile-container flex items-center gap-4">
        <img src="/src/Templates/Pictures/UserDefault-icon.png" alt="Perfil">        <div class="profile-text">
            <p class="greeting-text text-sm text-black font-semibold">Hi,</p>
            <p class="name-text text-xl font-semibold text-white">Your name HERE</p>
        </div>
    </div>

    <!-- Icono de configuración -->
    <button class="settings-button p-2 rounded-full bg-[#233554] hover:bg-[#64FFDA] transition duration-300">
        <img src="/src/Templates/Pictures/Setting_icon.png" alt="Configuración">
    </button>
</header>
</body>
</html>

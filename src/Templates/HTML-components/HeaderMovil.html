<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Responsive</title>
    <link rel="stylesheet" href="../CSS/HeaderMovil.css">
    <script defer src="../JS/HeaderMovil.js"></script>
</head>
<body>
<header class="navbar">
    <div class="logo">
        <img src="../Pictures/logo.png" alt="Logo Empresa">
    </div>
    <div class="icons">
        <div class="icon search-icon">
            <img src="../Pictures/Buscador.png" alt="Buscar">
            <div class="search-container">
                <input type="text" placeholder="Buscar...">
            </div>
        </div>
        <div class="icon profile-icon">
            <a href="../HTML/Tu_Cuenta.html">
                <img src="../Pictures/UserDefault-icon.png" alt="Usuario">
            </a>
        </div>
        <div class="icon menu-icon">
            <img src="../Pictures/hamburguesa.png" alt="Menú">
            <div class="menu-container">
                <a href="../HTML/Tu_Cuenta.html">Tu cuenta</a>
                <a href="#">Opción 2</a>
                <a href="#">Opción 3</a>
            </div>
        </div>
    </div>
</header>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header Responsive</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
  <link rel="stylesheet" href="../CSS/Hi_user.css">
  <link rel="stylesheet" href="../CSS/OptionsBar.css">
  <script defer src="../JS/Hi_user.js"></script>
  <script defer src="../JS/OptionsBar.js"></script>
</head>
<body class="bg-[#0A192F] text-white font-[Poppins]">
<header class="header-container">
  <!-- Contenedor del perfil -->
  <div class="profile-container">
    <img src="../Pictures/profile-placeholder.svg" alt="Perfil" class="profile-image">
    <div class="profile-text">
      <p class="greeting-text">Hi,</p>
      <p class="name-text">Your name HERE</p>
    </div>
  </div>

  <!-- Icono de configuración -->
  <button class="settings-button">
    <img src="../Pictures/settings-icon.svg" alt="Configuración" class="settings-icon">
  </button>
</header>

<!-- Barra de opciones -->
<nav class="options-bar">
  <button class="option-item">
    <img src="../Pictures/icon1.svg" alt="Opción 1" class="option-icon">
    <span class="option-text">Opción 1</span>
  </button>
  <button class="option-item">
    <img src="../Pictures/icon2.svg" alt="Opción 2" class="option-icon">
    <span class="option-text">Opción 2</span>
  </button>
  <button class="option-item">
    <img src="../Pictures/icon3.svg" alt="Opción 3" class="option-icon">
    <span class="option-text">Opción 3</span>
  </button>
</nav>
</body>
</html>

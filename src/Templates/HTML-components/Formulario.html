<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Form</title>
  <link rel="stylesheet" href="../CSS/styleFormulario.css">
  <script src="../JS/FormularioScript.js" defer></script>
</head>
<body>
<div class="formulario">
  <div class="form-container">
    <a href="../HTML/CompanyRegister.html">
      <button class="top-button">Sign your company</button>
    </a>
    <h2>User Sign</h2>
    <form id="signupForm">
      <div class="field-container">
        <input type="text" id="fullName" placeholder="Full Name">
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        <input type="password" id="confirmPassword" placeholder="Confirm Password">
      </div>

      <div class="phone-group">
        <div class="custom-select">
          <div class="selected-option">
            <img id="selected-flag" src="../Pictures/us.png" alt="Flag">
            <span id="selected-code">+1</span>
          </div>
          <ul class="dropdown">
            <li data-code="+1" data-flag="us.png">🇺🇸 +1 (USA)</li>
            <li data-code="+44" data-flag="uk.png">🇬🇧 +44 (UK)</li>
            <li data-code="+34" data-flag="es.png">🇪🇸 +34 (Spain)</li>
            <li data-code="+33" data-flag="fr.png">🇫🇷 +33 (France)</li>
            <li data-code="+49" data-flag="de.png">🇩🇪 +49 (Germany)</li>
            <li data-code="+52" data-flag="mx.png">🇲🇽 +52 (Mexico)</li>
            <li data-code="+55" data-flag="br.png">🇧🇷 +55 (Brazil)</li>
          </ul>
        </div>
        <input type="tel" id="phone" placeholder="Phone Number">
      </div>

      <button type="submit">Sign in</button>
    </form>
    <a href="../HTML/InicioSesion.html" class="login-link">Do you already have an account?</a>
  </div>
</div>

<!-- 🔹 Popup Modal -->
<div id="errorModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h3>Error en el formulario</h3>
    <ul id="errorList"></ul>
  </div>
</div>

</body>
</html>

<div id="ServiceContainer">
  <h1>Services</h1>
  <label for="service-name">Name of service:</label>
  <input type="text" id="service-name" placeholder="Enter service name" />

  <label for="cost">Cost (€):</label>
  <input type="number" id="cost" placeholder="Enter cost" step="0.01" />

  <label for="time-cost">Time cost:</label>
  <input type="time" id="time-cost" />

  <button id="add-service">Add at services</button>
</div>

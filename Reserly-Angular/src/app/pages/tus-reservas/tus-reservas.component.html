<app-logged-header></app-logged-header>

<div class="main-container">
  <div class="reservations-header">
    <h1>Your Reservations</h1>
    <p>Here you can manage your reservations and check history and additional information.</p>
  </div>

  <div class="search-visited-container">
    <div id="SearchService" class="search-service">
      <h3>Search by Service</h3>
      <input type="text" placeholder="Search" />
      <select>
        <option>Category</option>
      </select>
      <select>
        <option>Location</option>
      </select>
      <button class="search-button">Search</button>
    </div>

    <div id="VisitedBefore" class="visited-before">
      <h3>Previously Visited</h3>
      <div class="visited-box"></div>
      <p><strong>Location</strong><br />Service booked, date... Text...</p>
      <button class="reserve-again" routerLink="/company-website">Book Again</button>
    </div>
  </div>

  <div class="accordion-container">
    <button class="accordion" routerLink="/company-website">Accordion toggle top</button>
    <div class="panel"><p>Accordion content.</p></div>

    <button class="accordion" routerLink="/company-website">Accordion toggle middle</button>
    <div class="panel"><p>Accordion content.</p></div>

    <button class="accordion" routerLink="/company-website">Accordion expanded area</button>
    <div class="panel"><p>Accordion content.</p></div>

    <button class="accordion" routerLink="/company-website">Accordion toggle bottom</button>
    <div class="panel"><p>Accordion content.</p></div>
  </div>
</div>

<app-footer></app-footer>
